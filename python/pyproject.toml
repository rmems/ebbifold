[project]
name = "ebbifold"
version = "0.0.1"
description = "Spaced repetition over an embedding of concepts — Python port of todd866/cohort"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "jsonschema[format]>=4.23",
    "numpy>=2.1",
    "pydantic>=2.10",
    "uvicorn>=0.30",
]

[project.scripts]
ebbifold-review = "ebbifold.review.cli:main"
ebbifold-review-api = "ebbifold.review.api:main"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
    "pytest-cov>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ebbifold"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests import the package straight from src/ so CI can skip building it
# (uv sync --no-install-project --no-build — no setup-script execution).
pythonpath = ["src"]
