[project]
name = "ebbifold"
version = "0.0.1"
description = "Spaced repetition over an embedding of concepts — Python port of todd866/cohort"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ebbifold"]

[tool.pytest.ini_options]
testpaths = ["tests"]
